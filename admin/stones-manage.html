    <div class="container mt-xl mb-4xl">
      <div class="breadcrumb mb-lg">
        <a href="/admin/dashboard.html">Dashboard</a>
        <span class="breadcrumb-divider">/</span>
        <span>Manage Stones</span>
      </div>

      <div class="dashboard-header">
        <h1>Manage Stones</h1>
        <button id="addStoneBtn" class="btn btn-accent">+ Add New Stone</button>
      </div>

      <div class="card">
        <div class="table-container">
          <table class="table" id="stonesTable">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Type</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="stonesTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="stoneModal" class="modal">
      <div class="modal-content modal-lg">
        <div class="modal-header">
          <h3 id="modalTitle">Add Stone</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="stoneForm">
            <div class="form-group">
              <label for="stoneName" class="form-label required">Name</label>
              <input type="text" id="stoneName" class="form-input" required />
            </div>

            <div class="grid grid-cols-2 gap-md">
              <div class="form-group">
                <label for="stoneType" class="form-label required">Type</label>
                <select id="stoneType" class="form-input" required>
                  <option value="Marble">Marble</option>
                  <option value="Granite">Granite</option>
                  <option value="Limestone">Limestone</option>
                  <option value="Slate">Slate</option>
                  <option value="Sandstone">Sandstone</option>
                  <option value="Travertine">Travertine</option>
                </select>
              </div>
              <div class="form-group">
                <label for="stonePrice" class="form-label required"
                  >Price (per sq ft)</label
                >
                <input
                  type="number"
                  id="stonePrice"
                  class="form-input"
                  min="0"
                  step="0.01"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="stoneStock" class="form-label required"
                >Stock (sq ft)</label
              >
              <input
                type="number"
                id="stoneStock"
                class="form-input"
                min="0"
                required
              />
            </div>

            <div class="form-group">
              <label for="stoneDescription" class="form-label"
                >Description</label
              >
              <textarea
                id="stoneDescription"
                class="form-textarea"
                rows="3"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="stoneImage" class="form-label">Image URL</label>
              <input
                type="url"
                id="stoneImage"
                class="form-input"
                placeholder="https://..."
              />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="cancelBtn" class="btn btn-outline">Cancel</button>
          <button id="saveStoneBtn" class="btn btn-accent">Save Stone</button>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/js/app.js?v=4"></script>
    <script type="module" src="/assets/js/pages/stones-manage.js"></script>
