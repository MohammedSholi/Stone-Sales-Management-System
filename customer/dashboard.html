<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard - Hajari</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/css/base.css?v=4" />
    <link rel="stylesheet" href="/assets/css/components.css?v=4" />
    <link rel="stylesheet" href="/assets/css/layout.css?v=13" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/theme-toggle.css?v=6" />
    <link
      rel="icon"
      href="https://cdn-icons-png.flaticon.com/512/9920/9920984.png"
    />
    <script src="/assets/js/theme.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-container">
        <a href="/index.php" class="navbar-brand">
          <img
            src="/assets/img/logo-hajari.svg"
            alt="Hajari"
            class="navbar-logo"
          />
          <span>Hajari / حجري</span>
        </a>
        <div class="navbar-center">
          <div class="navbar-nav"></div>
        </div>
        <div class="navbar-right">
          <div class="navbar-actions-utilities"></div>
          <div class="theme-toggle">
            <input
              type="checkbox"
              id="darkModeToggle"
              class="theme-toggle__input"
              aria-label="Toggle dark mode"
            />
            <label for="darkModeToggle" class="theme-toggle__label">
              <span class="theme-toggle__sky"></span>
              <span class="theme-toggle__sun"></span>
              <span class="theme-toggle__moon"></span>
              <div class="theme-toggle__stars">
                <span class="theme-toggle__star theme-toggle__star--1"></span
                ><span class="theme-toggle__star theme-toggle__star--2"></span
                ><span class="theme-toggle__star theme-toggle__star--3"></span
                ><span class="theme-toggle__star theme-toggle__star--4"></span
                ><span class="theme-toggle__star theme-toggle__star--5"></span>
              </div>
              <span class="theme-toggle__cloud theme-toggle__cloud--1"></span>
              <span class="theme-toggle__cloud theme-toggle__cloud--2"></span>
              <div class="theme-toggle__hills">
                <span class="theme-toggle__hill theme-toggle__hill--1"></span
                ><span class="theme-toggle__hill theme-toggle__hill--3"></span
                ><span class="theme-toggle__hill theme-toggle__hill--2"></span
                ><span class="theme-toggle__tree"
                  ><div class="theme-toggle__tree-top"></div>
                  <div class="theme-toggle__tree-trunk"></div
                ></span>
              </div>
              <span class="theme-toggle__knob"></span>
            </label>
          </div>
          <div class="navbar-actions-auth"></div>
          <button class="navbar-toggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <div class="navbar-mobile-menu">
        <div class="navbar-nav"></div>
        <div class="navbar-actions-mobile"></div>
      </div>
    </nav>

    <div class="container mt-xl mb-4xl">
      <div class="dashboard-header">
        <div>
          <h1>
            <span data-i18n="welcomeLabel">Welcome,</span>
            <span id="userName">Customer</span>!
          </h1>
          <p class="text-muted" data-i18n="dashboardSubtitle">
            Manage your orders and custom requests
          </p>
        </div>
        <a
          href="/customer/custom-request.html"
          class="btn btn-accent"
          data-i18n="newCustomRequest"
          >+ New Custom Request</a
        >
      </div>

      <div class="stats-grid mb-2xl">
        <div class="stat-card">
          <div class="stat-card-icon primary">📦</div>
          <div class="stat-card-content">
            <div class="stat-card-label" data-i18n="totalOrdersLabel">
              Total Orders
            </div>
            <div class="stat-card-value" id="totalOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon warning">⏳</div>
          <div class="stat-card-content">
            <div class="stat-card-label" data-i18n="pendingOrdersLabel">
              Pending
            </div>
            <div class="stat-card-value" id="pendingOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon success">✓</div>
          <div class="stat-card-content">
            <div class="stat-card-label" data-i18n="completedOrdersLabel">
              Completed
            </div>
            <div class="stat-card-value" id="completedOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon accent">📋</div>
          <div class="stat-card-content">
            <div class="stat-card-label" data-i18n="requestsLabel">
              Requests
            </div>
            <div class="stat-card-value" id="totalRequests">0</div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div>
          <h2 class="mb-lg" data-i18n="recentOrdersHeading">Recent Orders</h2>
          <div id="recentOrders"></div>
          <a
            href="/customer/my-orders.html"
            class="btn btn-outline w-full mt-lg"
            data-i18n="viewAllOrders"
            >View All Orders</a
          >
        </div>

        <div>
          <h2 class="mb-lg" data-i18n="customRequestsHeading">
            Custom Requests
          </h2>
          <div id="customRequests"></div>
          <a
            href="/customer/custom-request.html"
            class="btn btn-outline w-full mt-lg"
            data-i18n="newRequest"
            >New Request</a
          >
        </div>
      </div>
    </div>

    <script type="module" src="/assets/js/app.js?v=8"></script>
    <script type="module" src="/assets/js/pages/customer-dashboard.js"></script>
  </body>
</html>
