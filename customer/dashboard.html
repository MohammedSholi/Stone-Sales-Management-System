          <div class="navbar-nav"></div>

              <span class="theme-toggle__sky"></span>
              <span class="theme-toggle__sun"></span>

              <span class="theme-toggle__cloud theme-toggle__cloud--1"></span>
              <span class="theme-toggle__cloud theme-toggle__cloud--2"></span>
              <div class="theme-toggle__hills"><span class="theme-toggle__hill theme-toggle__hill--1"></span><span class="theme-toggle__hill theme-toggle__hill--3"></span><span class="theme-toggle__hill theme-toggle__hill--2"></span><span class="theme-toggle__tree"><div class="theme-toggle__tree-top"></div><div class="theme-toggle__tree-trunk"></div></span></div>

    <div class="container mt-xl mb-4xl">
      <div class="dashboard-header">
        <div>
          <h1>Welcome, <span id="userName">Customer</span>!</h1>
          <p class="text-muted">Manage your orders and custom requests</p>
        </div>
        <a href="/customer/custom-request.html" class="btn btn-accent"
          >+ New Custom Request</a
        >
      </div>

      <div class="stats-grid mb-2xl">
        <div class="stat-card">
          <div class="stat-card-icon primary">📦</div>
          <div class="stat-card-content">
            <div class="stat-card-label">Total Orders</div>
            <div class="stat-card-value" id="totalOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon warning">⏳</div>
          <div class="stat-card-content">
            <div class="stat-card-label">Pending</div>
            <div class="stat-card-value" id="pendingOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon success">✓</div>
          <div class="stat-card-content">
            <div class="stat-card-label">Completed</div>
            <div class="stat-card-value" id="completedOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon accent">📋</div>
          <div class="stat-card-content">
            <div class="stat-card-label">Requests</div>
            <div class="stat-card-value" id="totalRequests">0</div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div>
          <h2 class="mb-lg">Recent Orders</h2>
          <div id="recentOrders"></div>

          >

        <div>
          <h2 class="mb-lg">Custom Requests</h2>
          <div id="customRequests"></div>
          <a
            href="/customer/custom-request.html"
            class="btn btn-outline w-full mt-lg"
            >New Request</a
          >
        </div>
      </div>
