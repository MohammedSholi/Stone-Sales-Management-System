              <span class="theme-toggle__cloud theme-toggle__cloud--1"></span>
              <span class="theme-toggle__cloud theme-toggle__cloud--2"></span>
              <div class="theme-toggle__hills"><span class="theme-toggle__hill theme-toggle__hill--1"></span><span class="theme-toggle__hill theme-toggle__hill--3"></span><span class="theme-toggle__hill theme-toggle__hill--2"></span><span class="theme-toggle__tree"><div class="theme-toggle__tree-top"></div><div class="theme-toggle__tree-trunk"></div></span></div>

    <div class="container mt-xl">
      <div class="breadcrumb">
        <div class="breadcrumb-item"><a href="/index.php">Home</a></div>
        <span class="breadcrumb-separator">/</span>
        <div class="breadcrumb-item active">Catalog</div>
      </div>

      <div class="catalog-header">
        <div>
          <h1>Stone Catalog</h1>
          <p class="text-muted">
            Browse our premium selection of natural stones
          </p>
        </div>
        <div class="catalog-results">
          <span id="resultsCount">Loading...</span>
        </div>
      </div>

      <div class="catalog-layout">
        <!-- Filters Sidebar -->
        <aside class="catalog-sidebar">
          <div class="filter-section">
            <h3 class="filter-title">Search</h3>
            <div class="input-group">
              <span class="input-group-prepend">🔍</span>
              <input
                type="text"
                id="searchInput"
                class="form-input"
                placeholder="Search stones..."
              />
            </div>
          </div>

          <div class="filter-section">
            <h3 class="filter-title">Stone Type</h3>
            <div class="filter-options" id="typeFilters">
              <label class="form-check">
                <input type="checkbox" value="all" checked />
                <span>All Types</span>
              </label>
              <label class="form-check">
                <input type="checkbox" value="Marble" />
                <span>Marble</span>
              </label>
              <label class="form-check">
                <input type="checkbox" value="Limestone" />
                <span>Limestone</span>
              </label>
              <label class="form-check">
                <input type="checkbox" value="Jerusalem Stone" />
                <span>Jerusalem Stone</span>
              </label>
            </div>
          </div>

          <div class="filter-section">
            <h3 class="filter-title">Price Range</h3>
            <div class="price-range">
              <input
                type="range"
                id="priceMin"
                min="0"
                max="200"
                value="0"
                class="price-slider"
              />
              <input
                type="range"
                id="priceMax"
                min="0"
                max="200"
                value="200"
                class="price-slider"
              />
              <div class="price-display">
                <span>$<span id="priceMinValue">0</span></span>
                <span>$<span id="priceMaxValue">200</span></span>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <h3 class="filter-title">Availability</h3>
            <div class="filter-options">
              <label class="form-check">
                <input type="checkbox" id="inStockOnly" />
                <span>In Stock Only</span>
              </label>
              <label class="form-check">
                <input type="checkbox" id="bestsellersOnly" />
                <span>Bestsellers Only</span>
              </label>
            </div>
          </div>

          <button class="btn btn-ghost w-full" id="clearFilters">
            Clear All Filters
          </button>
        </aside>

        <!-- Products Grid -->
        <main class="catalog-main">
          <div class="catalog-controls">
            <div class="catalog-view-toggle">
              <button
                class="view-btn active"
                data-view="grid"
                title="Grid view"
              >
                ⊞
              </button>
              <button class="view-btn" data-view="list" title="List view">
                ☰
              </button>
            </div>

            <div class="catalog-sort">
              <label for="sortBy">Sort by:</label>
              <select id="sortBy" class="form-select">
                <option value="featured">Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name">Name: A-Z</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
          </div>

          <div class="product-grid" id="productsGrid">
            <!-- Products will be loaded here -->
          </div>

          <div class="pagination" id="pagination">
            <!-- Pagination will be generated here -->
          </div>
        </main>
      </div>
    </div>
