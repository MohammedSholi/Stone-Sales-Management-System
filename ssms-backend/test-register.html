<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Test - SSMS Backend</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }
      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
      }
      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }
      button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }
      .btn-secondary {
        background: #f5f5f5;
        color: #333;
      }
      .btn-secondary:hover {
        background: #e0e0e0;
      }
      .response-box {
        margin-top: 30px;
        padding: 20px;
        border-radius: 5px;
        display: none;
        max-height: 500px;
        overflow-y: auto;
      }
      .response-box.success {
        background: #d4edda;
        border: 2px solid #28a745;
        display: block;
      }
      .response-box.error {
        background: #f8d7da;
        border: 2px solid #dc3545;
        display: block;
      }
      .response-box h3 {
        margin-bottom: 10px;
        font-size: 18px;
      }
      .response-box pre {
        background: rgba(0, 0, 0, 0.05);
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.5;
      }
      .status-badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-right: 10px;
      }
      .status-badge.success {
        background: #28a745;
        color: white;
      }
      .status-badge.error {
        background: #dc3545;
        color: white;
      }
      .debug-info {
        margin-top: 15px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 5px;
      }
      .debug-info h4 {
        margin-bottom: 10px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔧 Registration Test</h1>
      <p class="subtitle">
        Backend Debug Interface - Test user registration with real-time feedback
      </p>

      <form id="registerForm">
        <div class="form-group">
          <label>Username *</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="e.g., testuser123"
            minlength="3"
            maxlength="50"
          />
        </div>

        <div class="form-group">
          <label>Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Minimum 6 characters"
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g., test@example.com"
          />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input
            type="text"
            id="phone"
            name="phone"
            placeholder="e.g., 0590000000"
          />
        </div>

        <div class="form-group">
          <label>Address</label>
          <input
            type="text"
            id="address"
            name="address"
            placeholder="e.g., Nablus, Palestine"
          />
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-primary">✅ Test Register</button>
          <button type="button" class="btn-secondary" onclick="testPing()">
            🔍 Test DB Connection
          </button>
        </div>
      </form>

      <div id="responseBox" class="response-box"></div>
    </div>

    <script>
      const API_URL = "http://localhost/ssms-backend/public/api";

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            email: document.getElementById("email").value || undefined,
            phone: document.getElementById("phone").value || undefined,
            address: document.getElementById("address").value || undefined,
          };

          showResponse("Testing registration...", "info");

          try {
            const response = await fetch(`${API_URL}/auth/register`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify(formData),
            });

            const data = await response.json();

            if (data.success) {
              showResponse("Registration Successful!", "success", data);
            } else {
              showResponse("Registration Failed", "error", data);
            }
          } catch (error) {
            showResponse("Network Error", "error", {
              error: {
                code: "NETWORK_ERROR",
                message: error.message,
              },
            });
          }
        });

      async function testPing() {
        showResponse("Testing database connection...", "info");

        try {
          const response = await fetch(`${API_URL}/debug/ping`);
          const data = await response.json();

          if (data.success) {
            showResponse("Database Connection OK!", "success", data);
          } else {
            showResponse("Database Connection Failed", "error", data);
          }
        } catch (error) {
          showResponse("Network Error", "error", {
            error: {
              code: "NETWORK_ERROR",
              message: error.message,
            },
          });
        }
      }

      function showResponse(title, type, data = null) {
        const box = document.getElementById("responseBox");
        box.className = `response-box ${type}`;

        let html = `<h3><span class="status-badge ${type}">${type.toUpperCase()}</span>${title}</h3>`;

        if (data) {
          if (data.success && data.data) {
            html += `<div class="debug-info">`;
            html += `<h4>✅ Created User:</h4>`;
            html += `<pre>${JSON.stringify(data.data, null, 2)}</pre>`;
            html += `</div>`;
          }

          if (!data.success && data.error) {
            html += `<div class="debug-info">`;
            html += `<h4>❌ Error Details:</h4>`;
            html += `<pre>${JSON.stringify(data.error, null, 2)}</pre>`;
            html += `</div>`;
          }

          if (data.debug) {
            html += `<div class="debug-info">`;
            html += `<h4>🔍 Debug Information:</h4>`;
            html += `<pre>${JSON.stringify(data.debug, null, 2)}</pre>`;
            html += `</div>`;
          }

          html += `<div class="debug-info">`;
          html += `<h4>📦 Full Response:</h4>`;
          html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          html += `</div>`;
        }

        box.innerHTML = html;
      }
    </script>
  </body>
</html>
