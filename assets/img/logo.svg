<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Geometric stone block logo for SSMS -->
  <rect width="40" height="40" rx="8" fill="url(#g)"/>
  <!-- Top face of block (lighter, 3D effect) -->
  <path d="M10 14 L20 8 L30 14 L20 20Z" fill="#e8ddd0" opacity="0.9"/>
  <!-- Left face -->
  <path d="M10 14 L20 20 L20 28 L10 22Z" fill="#c4a97d"/>
  <!-- Right face -->
  <path d="M30 14 L20 20 L20 28 L30 22Z" fill="#9d6835"/>
  <!-- Subtle vein line across top face -->
  <path d="M14 14.5 L22 11" stroke="#d8c3a5" stroke-width="0.6" opacity="0.5"/>
  <path d="M16 17 L24 13.5" stroke="#b89b72" stroke-width="0.4" opacity="0.4"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="40" y2="40">
      <stop offset="0%" stop-color="#1f2328"/>
      <stop offset="100%" stop-color="#3a3f47"/>
    </linearGradient>
  </defs>
</svg>
