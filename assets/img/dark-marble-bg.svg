<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="veins">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.06" numOctaves="3" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0 0 0.08 0 0 0.05 0"/>
        <feFuncG type="discrete" tableValues="0 0 0 0.07 0 0 0.04 0"/>
        <feFuncB type="discrete" tableValues="0 0 0 0.06 0 0 0.03 0"/>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1d22"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.08"/>
  <rect width="100%" height="100%" filter="url(#veins)" opacity="0.4"/>
</svg>